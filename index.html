<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>LinkTree - HamzSenpaii</title>
        <link rel="stylesheet" href="style.css" type="text/css" media="all" />
        <script
            src="https://kit.fontawesome.com/f08ecadc6b.js"
            crossorigin="anonymous"
        ></script>
    </head>
    <body>
        <div class="wrapper">
            <header>
                <img
                    src="./assets/images/logo-hamzsenpaii.png"
                    alt="Logo HamzSenpaii"
                />
                <h1>HamzSenpaii</h1>
                <p>Always want to learn anytime.</p>
            </header>
            <nav>
                <ul>
                    <li>
                        <a
                            href="https://github.com/HamzSenpaii"
                            target="_blank"
                            aria-label="GitHub"
                        >
                            <i class="fa-brands fa-github"></i>
                        </a>
                    </li>
                    <li>
                        <a
                            href="https://www.tiktok.com/@hamzsenpaii"
                            target="_blank"
                            aria-label="Tiktok"
                        >
                            <i class="fa-brands fa-tiktok"></i>
                        </a>
                    </li>
                    <li>
                        <a
                            href="https://www.instagram.com/hamz_senpaii"
                            target="_blank"
                            aria-label="Instagram"
                        >
                            <i class="fa-brands fa-instagram"></i>
                        </a>
                    </li>
                    <li>
                        <a
                            href="https://youtube.com/@hamzsenpaii"
                            target="_blank"
                            aria-label="Youtube"
                        >
                            <i class="fa-brands fa-youtube"></i>
                        </a>
                    </li>
                </ul>
            </nav>
            <main>
                <section>
                    <ul>
                        <li>
                            <a
                                href="https://lynk.id/HamzSenpaii"
                                class="link-card"
                                target="_blank"
                            >
                                <div class="link-icon">
                                    <i class="fa-solid fa-bag-shopping"></i>
                                </div>
                                <p>Lynk.id</p>
                                <div class="link-action">
                                    <i class="fa-solid fa-arrow-right"></i>
                                </div>
                            </a>
                        </li>
                        <li>
                            <a
                                href="https://t.me/HamzSenpaii"
                                class="link-card"
                                target="_blank"
                            >
                                <div class="link-icon">
                                    <i class="fa-brands fa-telegram"></i>
                                </div>
                                <p>Contact via Telegram</p>
                                <div class="link-action">
                                    <i class="fa-solid fa-arrow-right"></i>
                                </div>
                            </a>
                        </li>
                        <li>
                            <a
                                href="https://wa.me/6281382188429"
                                class="link-card"
                                target="_blank"
                            >
                                <div class="link-icon">
                                    <i class="fa-brands fa-whatsapp"></i>
                                </div>
                                <p>Contact via WhatsApp</p>
                                <div class="link-action">
                                    <i class="fa-solid fa-arrow-right"></i>
                                </div>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="link-card" target="_blank">
                                <div class="link-icon">
                                    <i class="fa-solid fa-gift"></i>
                                </div>
                                <p>Support Me on Saweria</p>
                                <div class="link-action">
                                    <i class="fa-solid fa-arrow-right"></i>
                                </div>
                            </a>
                        </li>
                    </ul>
                </section>
            </main>
            <footer>
                <small>&copy; 2026 HamzSenpaii. All rights reserved.</small>
            </footer>
        </div>
    </body>
</html>
